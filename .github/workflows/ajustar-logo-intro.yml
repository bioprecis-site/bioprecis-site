name: Ajustar somente logo da intro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajustar-logo-intro.yml'

permissions:
  contents: write

jobs:
  atualizar-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Substituir apenas o elemento visual da intro
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          old = '''<div class="intro-visual">
                <div class="atom" style="width:220px;height:220px;margin:auto">
                  <div class="ring"></div>
                  <div class="ring"></div>
                  <div class="ring"></div>
                  <div class="core"></div>
                </div>
              </div>'''

          new = '''<div class="intro-visual">
                <button class="bioprecis-mark" type="button" aria-label="Logo interativa da BIOPRECIS" onclick="this.classList.toggle('activated')">
                  <span class="mark-halo mark-halo-a"></span>
                  <span class="mark-halo mark-halo-b"></span>
                  <svg class="mark-svg" viewBox="0 0 360 250" role="img" aria-label="DNA, microbioma e biotecnologia BIOPRECIS">
                    <defs>
                      <linearGradient id="bpCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63f0f2"/><stop offset="1" stop-color="#62aaff"/></linearGradient>
                      <linearGradient id="bpGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55dda2"/><stop offset="1" stop-color="#63f0f2"/></linearGradient>
                      <filter id="bpGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    </defs>
                    <g class="dna-part" fill="none" stroke="url(#bpCyan)" stroke-width="7" stroke-linecap="round">
                      <path d="M58 28 C118 56 20 98 82 126 C137 151 35 191 93 222"/><path d="M111 28 C51 56 149 98 87 126 C32 151 134 191 76 222" opacity=".82"/><path d="M67 46 L101 46 M53 73 L116 73 M50 102 L118 102 M60 134 L109 134 M53 166 L116 166 M65 198 L101 198" stroke-width="4" opacity=".65"/>
                    </g>
                    <g class="microbe-part" fill="url(#bpGreen)" filter="url(#bpGlow)">
                      <ellipse cx="170" cy="75" rx="23" ry="10" transform="rotate(12 170 75)"/><ellipse cx="214" cy="58" rx="11" ry="21" transform="rotate(31 214 58)"/><ellipse cx="198" cy="111" rx="24" ry="12" transform="rotate(-28 198 111)"/><ellipse cx="155" cy="123" rx="13" ry="22" transform="rotate(40 155 123)"/><circle cx="232" cy="96" r="8"/><circle cx="141" cy="88" r="7"/><circle cx="180" cy="151" r="8"/><circle cx="220" cy="145" r="5"/>
                    </g>
                    <g class="chip-part" transform="translate(247 52)" filter="url(#bpGlow)">
                      <rect x="0" y="0" width="82" height="82" rx="18" fill="rgba(6,35,46,.82)" stroke="url(#bpCyan)" stroke-width="6"/><path d="M17 20 C35 7 62 17 63 40 C64 60 48 68 31 59 C17 52 9 35 17 20Z" fill="url(#bpGreen)"/><circle cx="33" cy="32" r="6" fill="#082b39"/><circle cx="49" cy="45" r="5" fill="#082b39"/><path d="M15 -10 V0 M31 -10 V0 M47 -10 V0 M63 -10 V0 M15 82 V92 M31 82 V92 M47 82 V92 M63 82 V92 M-10 15 H0 M-10 31 H0 M-10 47 H0 M-10 63 H0 M82 15 H92 M82 31 H92 M82 47 H92 M82 63 H92" stroke="#63f0f2" stroke-width="5" stroke-linecap="round"/>
                    </g>
                    <path class="data-flow" d="M118 182 C165 198 209 192 260 170" fill="none" stroke="url(#bpCyan)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 11"/>
                  </svg>
                  <span class="mark-caption">BIOPRECIS</span>
                  <span class="mark-touch">toque para interagir</span>
                </button>
              </div>'''

          css = '''
          <style id="bioprecis-mark-only">
          .bioprecis-mark{position:relative;width:min(92%,390px);aspect-ratio:1.18/1;border:0;background:radial-gradient(circle at 50% 44%,rgba(18,91,109,.22),rgba(4,24,33,.04) 60%,transparent 72%);padding:8px;cursor:pointer;color:inherit;display:grid;place-items:center;isolation:isolate;outline:none;transform:translateZ(0)}
          .bioprecis-mark::before{content:"";position:absolute;inset:7%;border:1px solid rgba(99,240,242,.15);border-radius:42%;transform:rotate(8deg);animation:markOrbitA 8s linear infinite;z-index:-1}.bioprecis-mark::after{content:"";position:absolute;inset:15%;border:1px solid rgba(98,170,255,.14);border-radius:46%;transform:rotate(-18deg);animation:markOrbitB 11s linear infinite;z-index:-1}
          .mark-svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 18px rgba(99,240,242,.18));transition:transform .45s ease,filter .45s ease}.dna-part{transform-origin:85px 125px;animation:dnaBreath 3.8s ease-in-out infinite}.microbe-part ellipse,.microbe-part circle{transform-box:fill-box;transform-origin:center;animation:microFloat 3.2s ease-in-out infinite}.microbe-part ellipse:nth-child(2),.microbe-part circle:nth-child(6){animation-delay:-1.1s}.microbe-part ellipse:nth-child(3),.microbe-part circle:nth-child(7){animation-delay:-2s}.chip-part{transform-origin:288px 93px;animation:chipPulse 3.6s ease-in-out infinite}.data-flow{animation:dataMove 2.8s linear infinite}
          .mark-caption{position:absolute;bottom:15%;font-size:clamp(19px,4vw,28px);font-weight:950;letter-spacing:4px;color:#eaffff;text-shadow:0 0 18px rgba(99,240,242,.45)}.mark-touch{position:absolute;bottom:7%;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6f9aa5;opacity:.85}.mark-halo{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}.mark-halo-a{width:45%;height:45%;background:radial-gradient(circle,rgba(99,240,242,.15),transparent 68%);animation:haloBreathe 3s ease-in-out infinite}.mark-halo-b{width:72%;height:72%;border:1px solid rgba(85,221,162,.1);animation:markOrbitB 10s linear infinite}
          .bioprecis-mark:hover .mark-svg,.bioprecis-mark:focus-visible .mark-svg,.bioprecis-mark.activated .mark-svg{transform:scale(1.045);filter:drop-shadow(0 0 28px rgba(99,240,242,.38)) drop-shadow(0 0 42px rgba(85,221,162,.16))}.bioprecis-mark.activated .chip-part{animation:chipActive .8s ease-in-out infinite alternate}.bioprecis-mark.activated .dna-part{animation:dnaActive 1.3s ease-in-out infinite alternate}.bioprecis-mark.activated .data-flow{stroke-dasharray:5 7;animation-duration:1.1s}.bioprecis-mark.activated .mark-touch{color:#55dda2;text-shadow:0 0 10px rgba(85,221,162,.5)}
          @keyframes dnaBreath{50%{transform:scale(1.025)}}@keyframes microFloat{50%{transform:translateY(-5px) scale(1.05)}}@keyframes chipPulse{50%{opacity:.82;filter:brightness(1.15)}}@keyframes chipActive{to{transform:translate(247px,52px) scale(1.06) rotate(1.5deg)}}@keyframes dnaActive{to{transform:scale(1.055) rotate(-1deg)}}@keyframes dataMove{to{stroke-dashoffset:-38}}@keyframes haloBreathe{50%{transform:scale(1.13);opacity:.6}}@keyframes markOrbitA{to{transform:rotate(368deg)}}@keyframes markOrbitB{to{transform:rotate(-378deg)}}
          @media(max-width:760px){.bioprecis-mark{width:min(92%,350px)}.mark-caption{bottom:13%}.mark-touch{bottom:5%}}
          </style>
          '''

          if old not in html:
              raise SystemExit('O elemento original da intro não foi encontrado. Nenhuma outra área foi alterada.')
          html = html.replace(old, new, 1)
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Confirmar que só index.html mudou
        run: git status --short
      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name "BIOPRECIS updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Troca somente o visual da logo na intro" || exit 0
          git push
