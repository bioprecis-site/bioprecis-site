name: BIOPRECIS 1.1 - melhorias gerais

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bioprecis-11-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar melhorias
        run: python3 upgrade_bioprecis_11.py
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',h,re.S)
          js='\n'.join(s for s in scripts if not s.lstrip().startswith('{"@context"'))
          Path('/tmp/site.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Publicar
        run: |
          git config user.name "BIOPRECIS updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html robots.txt sitemap.xml manifest.webmanifest social-card.svg
          git commit -m "BIOPRECIS 1.1: SEO, mobile, transparência e persistência" || exit 0
          git push
